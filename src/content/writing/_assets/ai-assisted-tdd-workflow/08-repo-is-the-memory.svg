<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" role="img" aria-label="Diagram: the repository is the memory. AGENTS.md, CONTEXT.md, the ADRs, the TDD skill, and the existing tests feed every fresh agent session, which produces red and green commits, a refreshed test report, and appended AI usage notes and raw chat logs, which in turn become context for the next session.">
