<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Sans+Pro:wght@300;400;600&family=Open+Sans:wght@300;400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://oppressor8901.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css?v={{ site.time | date: '%s' }}">
</head>
<body>

        <div class="container">

                <a href="/" class="nav-link">Home</a>
                <span class="nav-separator">|</span>
                <a href="/about" class="nav-link">About</a>
                <span class="nav-separator">|</span>
                <a href="/projects" class="nav-link">Projects</a>
                <span class="nav-separator">|</span>
                <div class="nav-dropdown" style="display:inline-block; position:relative;">
                    <button class="nav-link nav-dropdown-toggle" style="background:none; border:none; font:inherit; cursor:pointer; color:inherit; padding:0;">Writing ▼</button>
                    <div class="nav-dropdown-menu" style="display:none; position:absolute; left:0; top:100%; background:#f5ecd7; border:1px solid #d1bfa3; border-radius:4px; min-width:120px; z-index:10; box-shadow:1px 2px 6px #e0d3b8;">
                        <a href="/blog" class="nav-link" style="display:block; padding:0.4em 1em; color:#1565c0; text-decoration:underline;">Blog</a>
                        <a href="/til" class="nav-link" style="display:block; padding:0.4em 1em; color:#1565c0; text-decoration:underline;">TIL</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
<script>
// Simple dropdown toggle
const dropdown = document.querySelector('.nav-dropdown');
if (dropdown) {
  const toggle = dropdown.querySelector('.nav-dropdown-toggle');
  const menu = dropdown.querySelector('.nav-dropdown-menu');
  toggle.addEventListener('mouseenter', () => { menu.style.display = 'block'; });
  toggle.addEventListener('focus', () => { menu.style.display = 'block'; });
  dropdown.addEventListener('mouseleave', () => { menu.style.display = 'none'; });
}
</script>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            {{ content }}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="mailto:hello@chinmaysingh.me">Email</a>
                <a href="https://linkedin.com/in/singhchinmay" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/SinghChinmayy" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.instagram.com/singhchinmayy/" target="_blank" rel="noopener">Instagram</a>
                <a href="/til/" class="nav-link">TIL</a>
            </div>
            <div class="footer-search vintage-search" style="margin: 2em auto 0 auto; max-width: 420px; text-align: center;">
                <form onsubmit="return false;" style="display: flex; align-items: center; justify-content: center; background: #f5ecd7; border: 2px inset #bfae8e; border-radius: 6px; box-shadow: 1px 2px 0 #e0d3b8; padding: 0.4em 0.7em; font-family: 'Source Serif Pro', serif; position: relative;">
                    <span style="font-size: 1.3em; color: #8b4513; margin-right: 0.5em;">&#128269;</span>
                    <input type="text" id="footer-search-input" placeholder="Search (Ctrl+K) | tag:python | category:learning" style="width: 100%; background: #f5ecd7; border: none; outline: none; font-size: 1.08em; color: #3b2f1c; font-family: 'Source Serif Pro', serif; padding: 0.3em 2.2em 0.3em 0.5em; border-radius: 4px;" aria-label="Footer search" autocomplete="off">
                    <button id="footer-search-clear" type="button" aria-label="Clear search" style="position: absolute; right: 0.5em; background: none; border: none; font-size: 1.2em; color: #b8860b; cursor: pointer; display: none;">&times;</button>
                    <ul id="footer-autocomplete" style="position: absolute; left: 2.2em; right: 0.5em; top: 2.5em; z-index: 100; background: #fffbe9; border: 1px solid #d1bfa3; border-radius: 6px; box-shadow: 1px 2px 0 #e0d3b8; font-family: 'Source Serif Pro', serif; font-size: 1.01em; text-align: left; list-style: none; margin: 0; padding: 0; display: none; max-height: 180px; overflow-y: auto;"></ul>
                </form>
                <ul id="footer-results-container" style="list-style: none; padding: 0; margin-top: 0.7em; background: #fffbe9; border: 1px solid #d1bfa3; border-radius: 6px; box-shadow: 1px 2px 0 #e0d3b8; font-family: 'Source Serif Pro', serif; font-size: 1.01em; text-align: left; max-height: 320px; overflow-y: auto;"></ul>
            </div>
            <!-- Mobile Search Modal Overlay -->
            <div id="mobile-search-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(245,236,215,0.97); z-index:10000; align-items:flex-start; justify-content:center;">
              <div style="max-width:500px; width:94vw; margin:4vh auto 0 auto; background:#fffbe9; border:2px solid #d1bfa3; border-radius:8px; box-shadow:0 4px 24px #bfae8e; padding:1.2em 1em 1em 1em; position:relative;">
                <button id="mobile-search-close" aria-label="Close search" style="position:absolute; top:0.7em; right:1em; background:none; border:none; font-size:1.5em; color:#8b4513; cursor:pointer;">&times;</button>
                <form onsubmit="return false;" style="display: flex; align-items: center; background: #f5ecd7; border: 2px inset #bfae8e; border-radius: 6px; box-shadow: 1px 2px 0 #e0d3b8; padding: 0.3em 0.5em; font-family: 'Source Serif Pro', serif;">
                  <span style="font-size: 1.3em; color: #8b4513; margin-right: 0.5em;">&#128269;</span>
                  <input type="text" id="mobile-search-input" placeholder="Search (Ctrl+K) | tag:python | category:learning" style="width: 100%; background: #f5ecd7; border: none; outline: none; font-size: 1.08em; color: #3b2f1c; font-family: 'Source Serif Pro', serif; padding: 0.3em 2.2em 0.3em 0.5em; border-radius: 4px;" aria-label="Mobile search" autocomplete="off">
                  <button id="mobile-search-clear" type="button" aria-label="Clear search" style="background: none; border: none; font-size: 1.2em; color: #b8860b; cursor: pointer; display: none;">&times;</button>
                </form>
                <ul id="mobile-autocomplete" style="background: #fffbe9; border: 1px solid #d1bfa3; border-radius: 6px; box-shadow: 1px 2px 0 #e0d3b8; font-family: 'Source Serif Pro', serif; font-size: 1.01em; text-align: left; list-style: none; margin: 0.7em 0 0 0; padding: 0; max-height: 180px; overflow-y: auto;"></ul>
                <ul id="mobile-results-container" style="list-style: none; padding: 0; margin-top: 0.7em; background: #fffbe9; border: 1px solid #d1bfa3; border-radius: 6px; box-shadow: 1px 2px 0 #e0d3b8; font-family: 'Source Serif Pro', serif; font-size: 1.01em; text-align: left; max-height: 320px; overflow-y: auto;"></ul>
              </div>
            </div>
            <!-- End Mobile Search Modal -->
            <div class="visitor-stats">
                <span class="visitor-counter">👥 Visitors: <span id="visit-count">Loading...</span></span>
                <span class="last-updated">📅 Last Updated: {{ site.time | date: '%B %d, %Y' }}</span>
            </div>
            <div class="validation-badges">
                <a href="https://github.com/SinghChinmayy" target="_blank" class="validation-badge">
                    <img src="https://img.shields.io/badge/GitHub-SinghChinmayy-blue?style=flat&logo=github" alt="GitHub Profile" width="88" height="31">
                </a>
            </div>
            <div class="validation-badges">
                <a href="https://validator.w3.org/check?uri={{ site.url }}{{ page.url }}" target="_blank" class="validation-badge">
                    <img src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML 4.01!" width="88" height="31">
                </a>
                <a href="https://jigsaw.w3.org/css-validator/check?uri={{ site.url }}{{ page.url }}" target="_blank" class="validation-badge">
                    <img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS!" width="88" height="31">
                </a>
            </div>
        </div>
    </footer>

    <!-- Copy Code JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Find all code blocks
            const codeBlocks = document.querySelectorAll('pre');
            
            codeBlocks.forEach(function(pre) {
                // Create copy button
                const copyButton = document.createElement('button');
                copyButton.className = 'copy-code-btn';
                copyButton.textContent = 'Copy Code';
                copyButton.setAttribute('aria-label', 'Copy code to clipboard');
                
                // Insert button at the top of the code block
                pre.insertBefore(copyButton, pre.firstChild);
                
                // Add click event
                copyButton.addEventListener('click', function() {
                    const code = pre.querySelector('code');
                    const textToCopy = code ? code.textContent : pre.textContent;
                    
                    // Copy to clipboard
                    navigator.clipboard.writeText(textToCopy).then(function() {
                        // Change button text temporarily
                        const originalText = copyButton.textContent;
                        copyButton.textContent = 'Copied!';
                        copyButton.classList.add('copied');
                        
                        // Reset after 2 seconds
                        setTimeout(function() {
                            copyButton.textContent = originalText;
                            copyButton.classList.remove('copied');
                        }, 2000);
                    }).catch(function(err) {
                        console.error('Failed to copy: ', err);
                        copyButton.textContent = 'Failed';
                        setTimeout(function() {
                            copyButton.textContent = 'Copy Code';
                        }, 2000);
                    });
                });
            });
            
            // Fetch real count from GoatCounter API
            const visitCountElement = document.getElementById('visit-count');
            if (visitCountElement) {
                // Show loading state
                visitCountElement.textContent = 'Loading...';
                
                // Fetch from GoatCounter API
                fetch('https://oppressor8901.goatcounter.com/api/v0/stats/total?start=2020-01-01')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data && data.total) {
                            visitCountElement.textContent = data.total.toLocaleString();
                        } else {
                            throw new Error('Invalid data format');
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching visitor count:', error);
                        // Fallback to a reasonable number or show error
                        visitCountElement.textContent = '1,337+';
                    });
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lunr/lunr.min.js"></script>
    <script>
    (function() {
      // Add SNS entries to the search index
      const snsDocs = [
        { title: 'Email', url: 'mailto:hello@chinmaysingh.me', content: 'Contact Chinmay Singh by email', type: 'SNS' },
        { title: 'LinkedIn', url: 'https://linkedin.com/in/singhchinmay', content: 'Chinmay Singh on LinkedIn', type: 'SNS' },
        { title: 'GitHub', url: 'https://github.com/SinghChinmayy', content: 'Chinmay Singh on GitHub', type: 'SNS' },
        { title: 'Instagram', url: 'https://www.instagram.com/singhchinmayy/', content: 'Chinmay Singh on Instagram', type: 'SNS' }
      ];
      let idx = null;
      let documents = [];
      let filteredDocs = [];
      let selectedIdx = -1;
      fetch('/search.json')
        .then(response => response.json())
        .then(data => {
          documents = data.concat(snsDocs);
          idx = lunr(function () {
            this.ref('url');
            this.field('title', { boost: 10 });
            this.field('content');
            this.field('type');
            this.field('tags');
            this.field('categories');
            // Enable fuzzy search by token expansion
            documents.forEach(function (doc) {
              this.add(doc);
            }, this);
          });
        });
      var input = document.getElementById('footer-search-input');
      var resultsContainer = document.getElementById('footer-results-container');
      var clearBtn = document.getElementById('footer-search-clear');
      function renderResults(results) {
        resultsContainer.innerHTML = '';
        if (!results || results.length === 0) {
          resultsContainer.innerHTML = '<li style="color:#888; padding:0.5em;">No results found.</li>';
          return;
        }
        results.slice(0, 7).forEach((result, i) => {
          const doc = documents.find(d => d.url === result.ref);
          let typeLabel = '';
          if (doc.type === 'TIL') typeLabel = '<span style="color:#1565c0; font-size:0.95em;">[TIL]</span>';
          else if (doc.type === 'Blog') typeLabel = '<span style="color:#8b4513; font-size:0.95em;">[Blog]</span>';
          else if (doc.type === 'SNS') typeLabel = '<span style="color:#b8860b; font-size:0.95em;">[SNS]</span>';
          const snippet = doc.content.length > 60 ? doc.content.substring(0, 60) + '...' : doc.content;
          resultsContainer.innerHTML += `<li class="footer-search-result${i === selectedIdx ? ' selected' : ''}" tabindex="-1" style="padding:0.5em 0.7em; border-bottom:1px dotted #d1bfa3; background:${i === selectedIdx ? '#f5ecd7' : 'none'};"><a href="${doc.url}" style="font-weight:600; color:#1565c0; text-decoration:underline;">${doc.title}</a> ${typeLabel}<br><span style="color:#555; font-size:0.98em;">${snippet}</span></li>`;
        });
      }
      function doSearch(query) {
        if (!idx || !query) {
          resultsContainer.innerHTML = '';
          filteredDocs = [];
          selectedIdx = -1;
          return;
        }
        // Always do fuzzy search, even for single character
        const fuzzyQuery = query.split(/\s+/).map(w => w + '~1').join(' ');
        const results = idx.search(fuzzyQuery);
        filteredDocs = results;
        selectedIdx = -1;
        renderResults(results);
      }
      if (input) {
        input.addEventListener('input', function(e) {
          doSearch(e.target.value);
          clearBtn.style.display = e.target.value ? 'block' : 'none';
        });
        input.addEventListener('focus', function() {
          if (input.value) clearBtn.style.display = 'block';
        });
        input.addEventListener('blur', function() {
          setTimeout(() => { clearBtn.style.display = 'none'; }, 200);
        });
        clearBtn.addEventListener('click', function() {
          input.value = '';
          clearBtn.style.display = 'none';
          resultsContainer.innerHTML = '';
          input.focus();
        });
        // Keyboard navigation
        input.addEventListener('keydown', function(e) {
          const resultsList = resultsContainer.querySelectorAll('.footer-search-result');
          if (!resultsList.length) return;
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIdx = (selectedIdx + 1) % resultsList.length;
            renderResults(filteredDocs);
            resultsList[selectedIdx].scrollIntoView({ block: 'nearest' });
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIdx = (selectedIdx - 1 + resultsList.length) % resultsList.length;
            renderResults(filteredDocs);
            resultsList[selectedIdx].scrollIntoView({ block: 'nearest' });
          } else if (e.key === 'Enter') {
            if (selectedIdx >= 0 && resultsList[selectedIdx]) {
              const link = resultsList[selectedIdx].querySelector('a');
              if (link) link.click();
            }
          }
        });
      }
      // Ctrl+K to focus search bar
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          input.focus();
          input.select();
        }
      });
      // Touch-friendly: increase tap area
      if (clearBtn) {
        clearBtn.style.touchAction = 'manipulation';
      }
      // Mobile modal logic
      var isMobile = window.matchMedia('(max-width: 900px)').matches;
      var footerInput = document.getElementById('footer-search-input');
      var footerClear = document.getElementById('footer-search-clear');
      var footerAutocomplete = document.getElementById('footer-autocomplete');
      var footerResults = document.getElementById('footer-results-container');
      var modal = document.getElementById('mobile-search-modal');
      var modalInput = document.getElementById('mobile-search-input');
      var modalClear = document.getElementById('mobile-search-clear');
      var modalAutocomplete = document.getElementById('mobile-autocomplete');
      var modalResults = document.getElementById('mobile-results-container');
      var modalClose = document.getElementById('mobile-search-close');
      // Show modal on mobile focus
      if (footerInput && isMobile) {
        footerInput.addEventListener('focus', function(e) {
          setTimeout(function() {
            modal.style.display = 'flex';
            modalInput.value = '';
            modalResults.innerHTML = '';
            modalAutocomplete.innerHTML = '';
            modalInput.focus();
          }, 100);
          setTimeout(function() { footerInput.blur(); }, 200);
        });
      }
      // Modal close logic
      if (modalClose) {
        modalClose.addEventListener('click', function() {
          modal.style.display = 'none';
          footerInput.blur();
        });
      }
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            modal.style.display = 'none';
            footerInput.blur();
          }
        });
      }
      document.addEventListener('keydown', function(e) {
        if (modal.style.display === 'flex' && e.key === 'Escape') {
          modal.style.display = 'none';
          footerInput.blur();
        }
      });
      // Mobile search logic (reuse desktop logic, but for modal elements)
      function renderMobileResults(results) {
        modalResults.innerHTML = '';
        if (!results || results.length === 0) {
          modalResults.innerHTML = '<li style="color:#888; padding:0.5em;">No results found.</li>';
          return;
        }
        results.slice(0, 7).forEach((result, i) => {
          const doc = documents.find(d => d.url === result.ref);
          let typeLabel = '';
          if (doc.type === 'TIL') typeLabel = '<span style="color:#1565c0; font-size:0.95em;">[TIL]</span>';
          else if (doc.type === 'Blog') typeLabel = '<span style="color:#8b4513; font-size:0.95em;">[Blog]</span>';
          else if (doc.type === 'SNS') typeLabel = '<span style="color:#b8860b; font-size:0.95em;">[SNS]</span>';
          const snippet = doc.content.length > 60 ? doc.content.substring(0, 60) + '...' : doc.content;
          modalResults.innerHTML += `<li class="footer-search-result" tabindex="-1" style="padding:0.5em 0.7em; border-bottom:1px dotted #d1bfa3;"><a href="${doc.url}" style="font-weight:600; color:#1565c0; text-decoration:underline;">${doc.title}</a> ${typeLabel}<br><span style="color:#555; font-size:0.98em;">${snippet}</span></li>`;
        });
      }
      function showMobileAutocomplete(query) {
        if (!query || !documents.length) {
          modalAutocomplete.style.display = 'none';
          modalAutocomplete.innerHTML = '';
          return;
        }
        const q = query.toLowerCase();
        // Debug logging
        console.log('Query:', q, 'Documents:', documents.map(d => d.title));
        // Prefix matches first, then substring matches
        const startsWith = documents.filter(d => d.title && d.title.toLowerCase().startsWith(q));
        const contains = documents.filter(d => d.title && !d.title.toLowerCase().startsWith(q) && d.title.toLowerCase().includes(q));
        const suggestions = startsWith.concat(contains).slice(0, 5);
        if (!suggestions.length) {
          modalAutocomplete.style.display = 'none';
          modalAutocomplete.innerHTML = '';
          return;
        }
        modalAutocomplete.innerHTML = suggestions.map((d, i) => `<li class="footer-autocomplete-item" data-title="${d.title.replace(/"/g, '&quot;')}" tabindex="0" style="padding:0.4em 0.7em; border-bottom:1px dotted #d1bfa3; background:#f5ecd7; cursor:pointer;${i===0?'font-weight:bold;':''}">${d.title}</li>`).join('');
        modalAutocomplete.style.display = 'block';
      }
      function doMobileSearch(query) {
        if (!idx || !query) {
          modalResults.innerHTML = '';
          return;
        }
        // Always do fuzzy search, even for single character
        const fuzzyQuery = query.split(/\s+/).map(w => w + '~1').join(' ');
        const results = idx.search(fuzzyQuery);
        renderMobileResults(results);
      }
      if (modalInput) {
        modalInput.addEventListener('input', function(e) {
          doMobileSearch(e.target.value);
          modalClear.style.display = e.target.value ? 'block' : 'none';
          showMobileAutocomplete(e.target.value);
        });
        modalInput.addEventListener('focus', function() {
          if (modalInput.value) modalClear.style.display = 'block';
          showMobileAutocomplete(modalInput.value);
        });
        modalInput.addEventListener('blur', function() {
          setTimeout(() => { modalClear.style.display = 'none'; modalAutocomplete.style.display = 'none'; }, 200);
        });
        modalClear.addEventListener('click', function() {
          modalInput.value = '';
          modalClear.style.display = 'none';
          modalResults.innerHTML = '';
          modalAutocomplete.style.display = 'none';
          modalInput.focus();
        });
        // Keyboard navigation for autocomplete
        modalInput.addEventListener('keydown', function(e) {
          const acItems = modalAutocomplete.querySelectorAll('.footer-autocomplete-item');
          if (modalAutocomplete.style.display === 'block' && acItems.length) {
            let idx = Array.from(acItems).findIndex(item => item === document.activeElement);
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              if (idx < acItems.length - 1) acItems[idx+1].focus();
              else acItems[0].focus();
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (idx > 0) acItems[idx-1].focus();
              else acItems[acItems.length-1].focus();
            } else if (e.key === 'Enter') {
              if (idx >= 0) {
                modalInput.value = acItems[idx].dataset.title;
                modalAutocomplete.style.display = 'none';
                doMobileSearch(modalInput.value);
                modalInput.focus();
              }
            }
          }
        });
        modalAutocomplete.addEventListener('mousedown', function(e) {
          if (e.target.classList.contains('footer-autocomplete-item')) {
            modalInput.value = e.target.dataset.title;
            modalAutocomplete.style.display = 'none';
            doMobileSearch(modalInput.value);
            modalInput.focus();
          }
        });
      }
      // End mobile modal logic
    })();
    </script>
</body>
