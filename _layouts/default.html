<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Sans+Pro:wght@300;400;600&family=Open+Sans:wght@300;400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- GoatCounter Analytics -->
    <script data-goatcounter="https://oppressor8901.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css?v={{ site.time | date: '%s' }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-menu">
                <a href="/" class="nav-link">Home</a>
                <span class="nav-separator">|</span>
                <a href="/about" class="nav-link">About</a>
                <span class="nav-separator">|</span>
                <a href="/projects" class="nav-link">Projects</a>
                <span class="nav-separator">|</span>
                <a href="/blog" class="nav-link">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            {{ content }}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="mailto:hello@chinmaysingh.me">Email</a>
                <a href="https://linkedin.com/in/singhchinmay" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/SinghChinmayy" target="_blank" rel="noopener">GitHub</a>
                <a href="https://instagram.com/chinmay.singh" target="_blank" rel="noopener">Instagram</a>
            </div>
            <div class="visitor-stats">
                <span class="visitor-counter">👥 Visitors: <span id="visit-count">Loading...</span></span>
                <span class="last-updated">📅 Last Updated: {{ site.time | date: '%B %d, %Y' }}</span>
            </div>
            <div class="validation-badges">
                <a href="https://validator.w3.org/check?uri={{ site.url }}{{ page.url }}" target="_blank" class="validation-badge">
                    <img src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML 4.01!" width="88" height="31">
                </a>
                <a href="https://jigsaw.w3.org/css-validator/check?uri={{ site.url }}{{ page.url }}" target="_blank" class="validation-badge">
                    <img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS!" width="88" height="31">
                </a>
            </div>
        </div>
    </footer>

    <!-- Copy Code JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Find all code blocks
            const codeBlocks = document.querySelectorAll('pre');
            
            codeBlocks.forEach(function(pre) {
                // Create copy button
                const copyButton = document.createElement('button');
                copyButton.className = 'copy-code-btn';
                copyButton.textContent = 'Copy Code';
                copyButton.setAttribute('aria-label', 'Copy code to clipboard');
                
                // Insert button at the top of the code block
                pre.insertBefore(copyButton, pre.firstChild);
                
                // Add click event
                copyButton.addEventListener('click', function() {
                    const code = pre.querySelector('code');
                    const textToCopy = code ? code.textContent : pre.textContent;
                    
                    // Copy to clipboard
                    navigator.clipboard.writeText(textToCopy).then(function() {
                        // Change button text temporarily
                        const originalText = copyButton.textContent;
                        copyButton.textContent = 'Copied!';
                        copyButton.classList.add('copied');
                        
                        // Reset after 2 seconds
                        setTimeout(function() {
                            copyButton.textContent = originalText;
                            copyButton.classList.remove('copied');
                        }, 2000);
                    }).catch(function(err) {
                        console.error('Failed to copy: ', err);
                        copyButton.textContent = 'Failed';
                        setTimeout(function() {
                            copyButton.textContent = 'Copy Code';
                        }, 2000);
                    });
                });
            });
            
            // Fetch real count from GoatCounter API
            const visitCountElement = document.getElementById('visit-count');
            if (visitCountElement) {
                // Show loading state
                visitCountElement.textContent = 'Loading...';
                
                // Fetch from GoatCounter API
                fetch('https://oppressor8901.goatcounter.com/api/v0/stats/total?start=2020-01-01')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data && data.total) {
                            visitCountElement.textContent = data.total.toLocaleString();
                        } else {
                            throw new Error('Invalid data format');
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching visitor count:', error);
                        // Fallback to a reasonable number or show error
                        visitCountElement.textContent = '1,337+';
                    });
            }
        });
    </script>
</body>
</html>
