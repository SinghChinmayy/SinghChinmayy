<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | TIL | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="/assets/css/style.css">
  {% if site.seo_tag %}{% seo %}{% endif %}
</head>
<body>
  {% include nav.html %}
  <main class="main-content">
    <div class="container">
      <div class="content-wrapper vintage-section">
        <header class="til-header">
          <h1 class="til-title" style="font-family: 'Source Serif Pro', serif; color: #3b2f1c;">{{ page.title }}</h1>
          {% if page.date %}
          <div class="til-meta" style="color: #8b4513; font-size: 1.05em; margin-bottom: 1em;">
            <span>📅 {{ page.date | date: "%B %d, %Y" }}</span>
          </div>
          {% endif %}
        </header>
        <div class="til-content">
          {{ content }}
        </div>
      </div>
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
