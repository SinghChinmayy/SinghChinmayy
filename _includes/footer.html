<footer class="footer">
  <div class="container">
    <div class="footer-links">
      {% for social in site.data.social %}
        <a href="{{ social.url }}" target="_blank" rel="noopener">{{ social.label }}</a>
      {% endfor %}
      <a href="/til/" class="nav-link">TIL</a>
    </div>
    <div class="visitor-stats">
      <span class="visitor-counter">👥 Visitors: <span id="visit-count">Loading...</span></span>
      <span class="last-updated">📅 Last Updated: {{ site.time | date: '%B %d, %Y' }}</span>
    </div>
    <div class="validation-badges">
      <a href="https://github.com/SinghChinmayy" target="_blank" class="validation-badge">
        <img src="https://img.shields.io/badge/GitHub-SinghChinmayy-blue?style=flat&logo=github" alt="GitHub Profile" width="88" height="31">
      </a>
    </div>
    <div class="validation-badges">
      <a href="https://validator.w3.org/check?uri={{ site.url }}{{ page.url }}" target="_blank" class="validation-badge">
        <img src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML 4.01!" width="88" height="31">
      </a>
      <a href="https://jigsaw.w3.org/css-validator/check?uri={{ site.url }}{{ page.url }}" target="_blank" class="validation-badge">
        <img src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS!" width="88" height="31">
      </a>
    </div>
    <div class="footer-credit" style="margin-top:1.5em; color:#8b4513; font-size:1em; font-family:'Source Serif Pro',serif;">
      <span style="display:block; font-family: 'Georgia', 'Times New Roman', serif; font-size:1.18em; font-style:italic; letter-spacing:0.01em; margin-bottom:0.2em;">Per aspera ad astra.</span>
      <span style="font-size:0.98em; color:#8b4513;">— Through hardships to the stars.</span><br>
    </div>
    <div class="footer-oss-credit" style="margin-top:1em; color:#b8860b; font-size:0.95em;">
      Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener" style="color:#1565c0;">Jekyll</a>,
      <a href="https://www.ruby-lang.org/" target="_blank" rel="noopener" style="color:#1565c0;">Ruby</a>,
      <a href="https://lunrjs.com/" target="_blank" rel="noopener" style="color:#1565c0;">Lunr.js</a>,
      and more <a href="/credits" style="color:#1565c0; text-decoration:underline;">❤️ More</a>
    </div>
    <div class="footer-oss-hail" style="margin-top:1.2em; color:#8b4513; font-size:0.98em; font-family:'Source Serif Pro',serif;">
      Cheers to all the makers and the dreamers!
    </div>

  </div>
</footer>
