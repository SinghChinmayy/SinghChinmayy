<nav class="navbar">
  <div class="container">
    <div class="nav-menu">
      {% assign nav_items = site.data.navigation %}
      {% for item in nav_items %}
        {% if item.title == 'Blog' or item.title == 'Contact' %}
          {% continue %}
        {% endif %}
        <a href="{{ item.url }}" class="nav-link">{{ item.title }}</a>
        <span class="nav-separator">|</span>
      {% endfor %}
    </div>
    <div class="nav-resume">
      <a href="/resume" target="_blank" class="resume-btn">
        <svg class="resume-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
        </svg>
        Resume
      </a>
    </div>
  </div>
</nav>
<script src="/assets/js/nav-dropdown.js"></script>
<script src="/assets/js/darkmode.js"></script>
