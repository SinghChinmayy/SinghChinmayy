<nav class="navbar">
  <div class="container">
    <div class="nav-menu">
      {% assign nav_items = site.data.navigation %}
      {% for item in nav_items %}
        {% if item.title == 'Blog' %}
          {% continue %}
        {% endif %}
        <a href="{{ item.url }}" class="nav-link">{{ item.title }}</a>
        <span class="nav-separator">|</span>
      {% endfor %}
      <div class="nav-dropdown" style="display:inline-block; position:relative;">
        <button class="nav-link nav-dropdown-toggle" style="background:none; border:none; font:inherit; cursor:pointer; color:inherit; padding:0;">More ▼</button>
        <div class="nav-dropdown-menu" style="display:none; position:absolute; left:0; top:100%; background:#f5ecd7; border:1px solid #d1bfa3; border-radius:4px; min-width:120px; z-index:10; box-shadow:1px 2px 6px #e0d3b8;">
          {% for item in nav_items %}
            {% if item.title == 'Blog' %}
              <a href="{{ item.url }}" class="nav-link" style="display:block; padding:0.4em 1em; color:#1565c0; text-decoration:underline;">{{ item.title }}</a>
            {% endif %}
          {% endfor %}
          <a href="/contact" class="nav-link" style="display:block; padding:0.4em 1em; color:#1565c0; text-decoration:underline;">Contact</a>
        </div>
      </div>
    </div>
    
    <div class="nav-resume">
      <a href="/resume" target="_blank" class="resume-btn">
        <svg class="resume-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
        </svg>
        Resume
      </a>
    </div>
  </div>
</nav>
<script src="/assets/js/nav-dropdown.js"></script>
<script src="/assets/js/darkmode.js"></script>
